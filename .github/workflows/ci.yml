name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.25']
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Build macOS arm64
        run: go build -o /tmp/claude-ai-relay .
        env:
          GOOS: darwin
          GOARCH: arm64
      - name: Run offline selfcheck
        run: go run . selfcheck
      - name: Test Homebrew automation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
