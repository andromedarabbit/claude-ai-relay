version: 2

project_name: claude-ai-relay

builds:
  - id: claude-ai-relay
    binary: claude-ai-relay
    goos: [darwin]
    goarch: [arm64]
    ldflags: ["-s -w"]

archives:
  - id: binaries
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  draft: true
